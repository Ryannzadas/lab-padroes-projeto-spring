spring.application.name=lab-padroes-projeto-spring

# Banco em memória (zera a cada execução). Console em /h2-console, JDBC URL abaixo, usuário "sa", sem senha.
spring.datasource.url=jdbc:h2:mem:gof
spring.h2.console.enabled=true
spring.jpa.open-in-view=false

# Swagger UI em /swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html

# Serviços de CEP, na ordem em que a corrente tenta
cep.viacep.url=https://viacep.com.br/ws
cep.brasilapi.url=https://brasilapi.com.br/api
